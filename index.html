<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Invent Jus - Leitor de Código de Barras</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;

      font-family: Arial, Helvetica, sans-serif;

      background:
        radial-gradient(circle at top,
        #102957 0%,
        #041b3d 45%,
        #021228 100%);

      color: white;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;

      padding-top: env(safe-area-inset-top);
    }

    .scanner-card {

      width: calc(100vw - 14px);
      max-width: 760px;

      margin: 16px auto 0 auto;

      padding: 30px 28px 34px 28px;

      border-radius: 34px;

      box-sizing: border-box;

      background:
        rgba(21, 41, 76, 0.88);

      border:
        1px solid rgba(255,255,255,0.10);

      box-shadow:
        0 20px 45px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo {

      width: 395px;
      max-width: 78%;

      display: block;

      margin: 0 auto 22px auto;
    }

    h1 {

      margin: 4px 0 14px 0;

      text-align: center;

      font-size: 31px;
      font-weight: 700;
    }

    .subtitle {

      margin: 0 0 28px 0;

      text-align: center;

      font-size: 25px;

      color:
        rgba(255,255,255,0.78);
    }

    .reader-wrapper {

      position: relative;

      width: 100%;

      aspect-ratio: 4 / 3;

      border-radius: 24px;

      overflow: hidden;

      background: black;

      box-shadow:
        0 10px 28px rgba(0,0,0,0.35);
    }

    #reader {

      width: 100%;
      height: 100%;
    }

    #reader video {

      width: 100% !important;
      height: 100% !important;

      object-fit: cover !important;
    }

    .overlay {

      position: absolute;

      inset: 0;

      pointer-events: none;

      z-index: 10;
    }

    .scan-box {

      position: absolute;

      left: 11%;
      right: 11%;

      top: 23%;

      height: 54%;

      background:
        rgba(255,255,255,0.10);
    }

    @keyframes laserMove {

      0% {
        top: 20%;
      }

      50% {
        top: 65%;
      }

      100% {
        top: 20%;
      }
    }

    .laser {

      position: absolute;

      left: 11%;
      right: 11%;

      height: 4px;

      background: #ff3a3a;

      box-shadow:
        0 0 8px #ff3a3a,
        0 0 18px #ff3a3a;

      animation:
        laserMove 1.7s ease-in-out infinite;
    }

    .corner {

      position: absolute;

      width: 58px;
      height: 58px;

      border-color: white;
      border-style: solid;
    }

    .top-left {

      left: 11%;
      top: 23%;

      border-width: 6px 0 0 6px;
    }

    .top-right {

      right: 11%;
      top: 23%;

      border-width: 6px 6px 0 0;
    }

    .bottom-left {

      left: 11%;
      bottom: 23%;

      border-width: 0 0 6px 6px;
    }

    .bottom-right {

      right: 11%;
      bottom: 23%;

      border-width: 0 6px 6px 0;
    }

    .hint {

      position: absolute;

      left: 0;
      right: 0;

      bottom: 42px;

      text-align: center;

      font-size: 23px;

       font-weight: 600;

      color:
        rgba(255,255,255,0.82);

      text-shadow:
        0 1px 4px rgba(0,0,0,0.85);
    }

    .status {

      margin-top: 28px;

      text-align: center;

      font-size: 28px;
      font-weight: 700;

      color:
        rgba(255,255,255,0.90);
    }

    .cancel-container {

      margin-top: 24px;

      display: flex;
      justify-content: center;
    }

    .cancel-button {

      width: 340px;
      max-width: 80%;

      height: 74px;

      border: none;

      border-radius: 22px;

      cursor: pointer;

      color: white;

      font-size: 30px;
      font-weight: 700;

      background:
        linear-gradient(
          180deg,
          #ef3737 0%,
          #c91515 100%
        );

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 8px 18px rgba(0,0,0,0.30);
    }

    @media (max-width: 768px) {

      .scanner-card {

        width: calc(100vw - 10px);

        padding:
          26px 18px 30px 18px;

        border-radius: 30px;
      }

      .logo {

        width: 340px;
        max-width: 82%;
      }

      h1 {

        font-size: 28px;
      }

      .subtitle {

        font-size: 18px;
      }

      .hint {

        font-size: 18px;
      }

      .status {

        font-size: 26px;
      }

      .cancel-button {

        width: 300px;

        height: 66px;

        font-size: 26px;
      }
    }

    @media (max-width: 420px) {

      .scanner-card {

        width: calc(100vw - 8px);

        padding:
          22px 14px 28px 14px;

        border-radius: 26px;

         margin-top: 10;
      }

      .logo {

        width: 300px;
        max-width: 84%;
      }

      h1 {

        font-size: 24px;
      }

      .subtitle {

        font-size: 16px;

        margin-bottom: 22px;
      }

      .corner {

        width: 46px;
        height: 46px;
      }

      .hint {

        font-size: 15px;

        bottom: 28px;
      }

      .status {

        font-size: 24px;

        margin-top: 24px;
      }

      .cancel-button {

        width: 260px;

        height: 60px;

        font-size: 24px;

        border-radius: 18px;
      }
    }

  </style>
</head>

<body>

  <div class="scanner-card">

    <img
      class="logo"
      src="logo-inventjus.png"
      alt="Invent Jus"
    />

    <h1>
      Leitor de código de barras
    </h1>

    <p class="subtitle">
      Centralize a etiqueta patrimonial dentro da área de leitura.
    </p>

    <div class="reader-wrapper">

      <div id="reader"></div>

      <div class="overlay">

        <div class="scan-box"></div>

        <div class="laser"></div>

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="hint">
          Aproxime e mantenha o código alinhado na horizontal
        </div>

      </div>

    </div>

    <div class="status" id="status">
      Lendo...
    </div>

    <div class="cancel-container">

      <button
        class="cancel-button"
        onclick="cancelarLeitura()">

        Cancelar

      </button>

    </div>

  </div>

  <script>

    const APP_URL =
      "https://inventario-patrimonial-orzkxr.flutterflow.app/listaBensInventariadosCopy";

    let html5QrCode;

    let leituraFinalizada = false;

    function voltarParaApp(tombo) {

      const url =
        `${APP_URL}?tombo=${encodeURIComponent(tombo)}&scanner_return=1&t=${Date.now()}`;

      window.location.href = url;
    }

    async function cancelarLeitura() {

      leituraFinalizada = true;

      try {

        if (html5QrCode) {

          await html5QrCode.stop();

          await html5QrCode.clear();
        }

      } catch (e) {

        console.log(
          "Erro ao parar câmera:",
          e
        );
      }

      voltarParaApp("");
    }

    function tocarBeep() {

      try {

        const audioCtx =
          new (
            window.AudioContext ||
            window.webkitAudioContext
          )();

        const oscillator =
          audioCtx.createOscillator();

        const gainNode =
          audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(
          audioCtx.destination
        );

        oscillator.type = "sine";

        oscillator.frequency.value = 900;

        gainNode.gain.value = 0.18;

        oscillator.start();

        setTimeout(() => {

          oscillator.stop();

          audioCtx.close();

        }, 150);

      } catch (e) {

        console.log(
          "Erro beep:",
          e
        );
      }
    }

    async function iniciarScanner() {

      html5QrCode =
        new Html5Qrcode("reader");

      const config = {

        fps: 12,

        aspectRatio: 1.3333333,

        formatsToSupport: [

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39
        ]
      };

      try {

        await html5QrCode.start(

          { facingMode: "environment" },

          config,

          async (decodedText) => {

            if (leituraFinalizada)
              return;

            leituraFinalizada = true;

            document.getElementById(
              "status"
            ).innerText =
              "Código lido!";

            tocarBeep();

            try {

              await html5QrCode.stop();

              await html5QrCode.clear();

            } catch (e) {

              console.log(
                "Erro ao finalizar:",
                e
              );
            }

            setTimeout(() => {

              voltarParaApp(decodedText);

            }, 250);
          },

          () => {
            // Ignora erros contínuos
          }
        );

      } catch (err) {

        document.getElementById(
          "status"
        ).innerText =
          "Erro ao acessar câmera";

        console.log(err);
      }
    }

    window.addEventListener(
      "load",
      iniciarScanner
    );

  </script>

</body>
</html>
