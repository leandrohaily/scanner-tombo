<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

  <title>Invent Jus - Leitor de Código de Barras</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #102957 0%, #041b3d 45%, #021228 100%);
      color: white;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: env(safe-area-inset-top);
    }

    .scanner-card {
      width: calc(100vw - 20px);
      max-width: 620px;
      margin: 24px auto 0 auto;
      padding: 22px 18px;
      border-radius: 26px;
      box-sizing: border-box;

      background: rgba(21, 41, 76, 0.88);

      border: 1px solid rgba(255,255,255,0.08);

      box-shadow:
        0 20px 45px rgba(0,0,0,0.35),
        inset 0 1px 0 rgba(255,255,255,0.04);
    }

    .logo {
      width: 220px;
      max-width: 60%;
      display: block;
      margin: 0 auto 10px auto;
    }

    h1 {
      margin: 6px 0 8px 0;
      text-align: center;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 18px 0;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.78);
    }

    .reader-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: black;

      box-shadow:
        0 10px 28px rgba(0,0,0,0.35);
    }

    #reader {
      width: 100%;
      height: 100%;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    .overlay {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
    }

    .scan-box {
      position: absolute;
      left: 22%;
      right: 22%;
      top: 31%;
      height: 38%;
      background: rgba(255,255,255,0.10);
    }

    .laser {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 50%;
      height: 3px;

      background: #ff3a3a;

      box-shadow:
        0 0 8px #ff3a3a,
        0 0 18px #ff3a3a;
    }

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: white;
      border-style: solid;
    }

    .top-left {
      left: 22%;
      top: 27%;
      border-width: 5px 0 0 5px;
    }

    .top-right {
      right: 22%;
      top: 27%;
      border-width: 5px 5px 0 0;
    }

    .bottom-left {
      left: 22%;
      bottom: 27%;
      border-width: 0 0 5px 5px;
    }

    .bottom-right {
      right: 22%;
      bottom: 27%;
      border-width: 0 5px 5px 0;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;

      text-align: center;

      font-size: 12px;

      color: rgba(255,255,255,0.82);

      text-shadow:
        0 1px 4px rgba(0,0,0,0.85);
    }

    .status {
      margin-top: 18px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255,255,255,0.90);
    }

    .cancel-container {
      margin-top: 18px;
      display: flex;
      justify-content: center;
    }

    .cancel-button {
      width: 220px;
      max-width: 70%;
      height: 48px;

      border: none;
      border-radius: 14px;

      cursor: pointer;

      color: white;
      font-size: 17px;
      font-weight: 700;

      background: linear-gradient(180deg, #ef3737 0%, #c91515 100%);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.28),
        0 8px 18px rgba(0,0,0,0.30);
    }

    @media (max-width: 768px) {

      .scanner-card {
        width: calc(100vw - 14px);
        margin-top: 18px;
        padding: 20px 14px;
      }

      .logo {
        width: 210px;
        max-width: 62%;
      }

      .reader-wrapper {
        aspect-ratio: 16 / 9;
      }

      h1 {
        font-size: 19px;
      }

      .subtitle {
        font-size: 12px;
      }
    }

    @media (max-width: 420px) {

      .scanner-card {
        width: calc(100vw - 10px);
        border-radius: 22px;
      }

      .logo {
        max-width: 64%;
      }

      .cancel-button {
        height: 46px;
      }
    }
  </style>
</head>

<body>

  <div class="scanner-card">

    <img
      class="logo"
      src="logo-inventjus.png"
      alt="Invent Jus"
    />

    <h1>Leitor de código de barras</h1>

    <p class="subtitle">
      Centralize a etiqueta patrimonial dentro da área de leitura.
    </p>

    <div class="reader-wrapper">

      <div id="reader"></div>

      <div class="overlay">

        <div class="scan-box"></div>

        <div class="laser"></div>

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>

        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="hint">
          Aproxime e mantenha o código alinhado na horizontal
        </div>

      </div>

    </div>

    <div class="status" id="status">
      Lendo...
    </div>

    <div class="cancel-container">
      <button class="cancel-button" onclick="cancelarLeitura()">
        Cancelar
      </button>
    </div>

  </div>

  <script>

    const APP_URL =
      "https://inventario-patrimonial-orzkxr.flutterflow.app/listaBensInventariadosCopy";

    let html5QrCode;
    let leituraFinalizada = false;

    function voltarParaApp(tombo) {

      const url =
        `${APP_URL}?tombo=${encodeURIComponent(tombo)}&scanner_return=1&t=${Date.now()}`;

      window.location.href = url;
    }

    async function cancelarLeitura() {

      leituraFinalizada = true;

      try {

        if (html5QrCode) {

          await html5QrCode.stop();
          await html5QrCode.clear();
        }

      } catch (e) {

        console.log("Erro ao parar câmera:", e);
      }

      voltarParaApp("cancelado");
    }

    function tocarBeep() {

      try {

        const audioCtx =
          new (window.AudioContext || window.webkitAudioContext)();

        const oscillator =
          audioCtx.createOscillator();

        const gainNode =
          audioCtx.createGain();

        oscillator.connect(gainNode);

        gainNode.connect(audioCtx.destination);

        oscillator.type = "sine";

        oscillator.frequency.value = 900;

        gainNode.gain.value = 0.18;

        oscillator.start();

        setTimeout(() => {

          oscillator.stop();
          audioCtx.close();

        }, 150);

      } catch (e) {

        console.log("Erro beep:", e);
      }
    }

    async function iniciarScanner() {

      html5QrCode =
        new Html5Qrcode("reader");

      const config = {

        fps: 12,

        qrbox: function(viewfinderWidth, viewfinderHeight) {

          return {

            width:
              Math.floor(viewfinderWidth * 0.56),

            height:
              Math.floor(viewfinderHeight * 0.24)
          };
        },

        aspectRatio: 1.7777778,

        formatsToSupport: [

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39
        ]
      };

      try {

        await html5QrCode.start(

          { facingMode: "environment" },

          config,

          async (decodedText) => {

            if (leituraFinalizada) return;

            leituraFinalizada = true;

            document.getElementById("status").innerText =
              "Código lido!";

            tocarBeep();

            try {

              await html5QrCode.stop();
              await html5QrCode.clear();

            } catch (e) {

              console.log("Erro ao finalizar:", e);
            }

            setTimeout(() => {

              voltarParaApp(decodedText);

            }, 250);
          },

          () => {
            // Ignora erros contínuos de leitura
          }
        );

      } catch (err) {

        document.getElementById("status").innerText =
          "Erro ao acessar câmera";

        console.log(err);
      }
    }

    window.addEventListener(
      "load",
      iniciarScanner
    );

  </script>

</body>
</html>
