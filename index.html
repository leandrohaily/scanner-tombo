<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Invent JUS</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      color: #fff;
      background: linear-gradient(180deg, #030d20 0%, #071a3b 45%, #041127 100%);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    .app {
      width: 100%;
      height: 100%;
      min-height: 100dvh;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, rgba(64, 110, 255, 0.15), transparent 40%);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .logo-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 8px; }
    .logo-wrap img { max-width: 200px; width: 100%; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.28)); }

    .title { text-align: center; font-size: 19px; font-weight: 700; margin-bottom: 4px; letter-spacing: 0.2px; }
    .subtitle { text-align: center; font-size: 14px; color: rgba(255,255,255,0.82); line-height: 1.45; margin-bottom: 12px; }

    /* Força o scanner a ocupar todo o espaço central disponível da tela */
    .scanner-shell {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      width: 100%;
      flex: 1; 
      display: flex;
      flex-direction: column;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 10px 30px rgba(0,0,0,0.4);
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      flex: 1;
      background: #000;
      border: none !important;
      position: relative;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 22px;
    }

    #reader__scan_region svg { display: none !important; }

    .overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

    .scan-box {
      position: absolute; left: 50%; top: 50%;
      width: 85%; height: 180px; 
      transform: translate(-50%, -50%);
      border: none !important;
      box-shadow: none !important; 
    }

    .laser-line {
      position: absolute; left: 5%; right: 5%; height: 3px;
      background: #ff4747; box-shadow: 0 0 12px #ff4747;
      animation: laserMove 2.2s ease-in-out infinite;
      z-index: 22;
      opacity: 0; 
      transition: opacity 0.5s;
    }
    
    .laser-active { opacity: 1 !important; }

    @keyframes laserMove { 
      0%, 100% { top: 12%; } 
      50% { top: 88%; } 
    }

    .scan-hint {
      position: absolute;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 13px;
      color: rgba(255,255,255,0.9);
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
      z-index: 23;
      opacity: 0;
      transition: opacity 0.5s;
    }

    .reading-status { 
      margin-top: 12px; 
      text-align: center; 
      font-size: 15px; 
      font-weight: 600; 
      color: rgba(255,255,255,0.92); 
    }

    .cancel-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 12px auto 0;
      width: 100%;
      max-width: 280px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(180deg, #d62828 0%, #b71c1c 100%);
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(0,0,0,0.3);
    }

    #successOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 168, 89, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }

    @media (max-width: 600px) {
      .app {
        padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom));
      }
    }
  </style>
</head>
<body>

  <div class="app">
    <div>
      <div class="logo-wrap">
        <img src="logo-inventjus.png" alt="Invent JUS">
      </div>

      <div class="title">Leitor de código de barras</div>
      <div class="subtitle">
        Centralize a etiqueta patrimonial dentro da área de leitura.
      </div>
    </div>

    <div class="scanner-shell">
      <div id="reader"></div>

      <div class="overlay">
        <div class="scan-box">
          <div class="laser-line" id="laser"></div>
        </div>

        <div class="scan-hint" id="hint">
          Aproxime e mantenha o código alinhado na horizontal
        </div>
      </div>
    </div>

    <div>
      <div class="reading-status" id="status-text">
        Iniciando...
      </div>

      <button class="cancel-btn" onclick="retornarAoApp('cancelado')">
        Cancelar
      </button>
    </div>
  </div>

  <div id="successOverlay">
    <div style="font-size:72px">✔</div>
    <div style="font-size:22px; font-weight:800">
      TOMBO LIDO
    </div>
  </div>

  <script>
    const APP_URL = "https://inventario-patrimonial-orzkxr.flutterflow.app/listaBensInventariadosCopy";

    let html5QrCode = null;
    let isReturning = false;

    function playSyntheticBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    async function retornarAoApp(codigo = null) {
      if (isReturning) return;
      isReturning = true;

      if (codigo && codigo !== 'cancelado') {
        document.getElementById("successOverlay").style.display = "flex";
        playSyntheticBeep();
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      }

      const url = new URL(APP_URL);

      if (codigo === 'cancelado') {
        url.searchParams.set("tombo", "cancelado");
      } else if (codigo) {
        url.searchParams.set("tombo", codigo.replace(/\D/g, ""));
      } else {
        url.searchParams.set("tombo", "");
      }

      url.searchParams.set("scanner_return", "1");
      url.searchParams.set("t", Date.now());

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
        } catch(e) {}
      }

      setTimeout(() => {
        window.location.assign(url.toString());
      }, codigo && codigo !== 'cancelado' ? 400 : 0);
    }

    function iniciarScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 25,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          // Torna o box de leitura responsivo ao tamanho da câmera ativa
          const minEdge = Math.min(viewfinderWidth, viewfinderHeight);
          const boxWidth = Math.floor(minEdge * 0.85);
          return { width: boxWidth, height: 160 };
        },
        aspectRatio: window.innerWidth / window.innerHeight
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (text) => {
          retornarAoApp(text);
        }
      ).then(() => {
        document.getElementById('status-text').innerText = "Lendo...";
        document.getElementById('laser').classList.add('laser-active');
        document.getElementById('hint').classList.add('laser-active');
      }).catch(() => {
        document.getElementById('status-text').innerText = "Erro ao acessar câmera.";
      });
    }

    window.addEventListener("load", () => {
      setTimeout(iniciarScanner, 200);
    });
  </script>

</body>
</html>
