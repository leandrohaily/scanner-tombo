<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Invent Jus - Leitor de Código de Barras</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top, #132b58 0%, #061a36 45%, #021226 100%);
      color: white;
      overflow-x: hidden;
    }

    body {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top);
    }

    .scanner-card {
      width: calc(100vw - 32px);
      max-width: 620px;
      margin: 32px auto 0 auto;
      padding: 22px 18px;
      border-radius: 24px;
      box-sizing: border-box;
      background: rgba(20, 42, 78, 0.82);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.35);
      text-align: center;
    }

    .logo {
      max-width: 230px;
      width: 58%;
      margin: 0 auto 10px auto;
      display: block;
    }

    h1 {
      margin: 8px 0 6px 0;
      font-size: 20px;
      font-weight: 700;
    }

    .subtitle {
      margin: 0 0 18px 0;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.78);
    }

    .reader-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
    }

    #reader {
      width: 100%;
      height: 100%;
      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
    }

    #reader__dashboard,
    #reader__scan_region img,
    #reader__header_message,
    #reader__camera_selection {
      display: none !important;
    }

    .overlay {
      pointer-events: none;
      position: absolute;
      inset: 0;
      z-index: 10;
    }

    .scan-box {
      position: absolute;
      left: 14%;
      right: 14%;
      top: 29%;
      height: 34%;
      background: rgba(255, 255, 255, 0.10);
    }

    .laser {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 49%;
      height: 3px;
      background: #ff3b3b;
      box-shadow: 0 0 12px #ff3b3b;
    }

    .corner {
      position: absolute;
      width: 42px;
      height: 42px;
      border-color: white;
      border-style: solid;
    }

    .top-left {
      left: 14%;
      top: 25%;
      border-width: 5px 0 0 5px;
    }

    .top-right {
      right: 14%;
      top: 25%;
      border-width: 5px 5px 0 0;
    }

    .bottom-left {
      left: 14%;
      bottom: 25%;
      border-width: 0 0 5px 5px;
    }

    .bottom-right {
      right: 14%;
      bottom: 25%;
      border-width: 0 5px 5px 0;
    }

    .hint {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 16px;
      font-size: 12px;
      color: rgba(255, 255, 255, 0.82);
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .status {
      margin: 20px 0 18px 0;
      font-size: 16px;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.85);
    }

    .cancel-button {
      width: 210px;
      max-width: 70%;
      height: 48px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(180deg, #ef3434 0%, #c91515 100%);
      color: white;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.35), 0 6px 16px rgba(0,0,0,0.28);
    }

    @media (max-width: 768px) {
      .scanner-card {
        width: calc(100vw - 16px);
        max-width: 620px;
        margin-top: 24px;
        padding: 20px 16px;
        border-radius: 22px;
      }

      .logo {
        width: 54%;
        max-width: 220px;
      }

      h1 {
        font-size: 19px;
      }

      .subtitle {
        font-size: 12px;
        margin-bottom: 16px;
      }

      .reader-wrapper {
        aspect-ratio: 16 / 9;
        border-radius: 17px;
      }
    }

    @media (max-width: 390px) {
      .scanner-card {
        width: calc(100vw - 12px);
        margin-top: 18px;
        padding: 18px 14px;
      }

      .cancel-button {
        height: 46px;
      }
    }
  </style>
</head>

<body>
  <div class="scanner-card">
    <img class="logo" src="https://leandrohaily.github.io/scanner-tombo/logo.png" alt="Invent Jus" />

    <h1>Leitor de código de barras</h1>
    <p class="subtitle">Centralize a etiqueta patrimonial dentro da área de leitura.</p>

    <div class="reader-wrapper">
      <div id="reader"></div>

      <div class="overlay">
        <div class="scan-box"></div>
        <div class="laser"></div>

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="hint">Aproxime e mantenha o código alinhado na horizontal</div>
      </div>
    </div>

    <div id="status" class="status">Lendo...</div>

    <button class="cancel-button" onclick="cancelarLeitura()">Cancelar</button>
  </div>

  <script>
    const APP_URL = "https://inventario-patrimonial-orzkxr.flutterflow.app/listaBensInventariadosCopy";

    let html5QrCode;
    let leituraFinalizada = false;

    function voltarParaApp(tombo) {
      const url = `${APP_URL}?tombo=${encodeURIComponent(tombo)}&scanner_return=1&t=${Date.now()}`;
      window.location.href = url;
    }

    async function cancelarLeitura() {
      leituraFinalizada = true;

      try {
        if (html5QrCode) {
          await html5QrCode.stop();
          await html5QrCode.clear();
        }
      } catch (e) {
        console.log("Erro ao parar leitor:", e);
      }

      voltarParaApp("cancelado");
    }

    function tocarBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = "sine";
        oscillator.frequency.value = 900;
        gainNode.gain.value = 0.18;

        oscillator.start();
        setTimeout(() => {
          oscillator.stop();
          audioCtx.close();
        }, 150);
      } catch (e) {
        console.log("Beep não executado:", e);
      }
    }

    async function iniciarLeitor() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 12,
        qrbox: function(viewfinderWidth, viewfinderHeight) {
          return {
            width: Math.floor(viewfinderWidth * 0.72),
            height: Math.floor(viewfinderHeight * 0.34)
          };
        },
        aspectRatio: 1.7777778,
        formatsToSupport: [
          Html5QrcodeSupportedFormats.CODE_128,
          Html5QrcodeSupportedFormats.CODE_39
        ]
      };

      try {
        await html5QrCode.start(
          { facingMode: "environment" },
          config,
          async function(decodedText) {
            if (leituraFinalizada) return;

            leituraFinalizada = true;
            document.getElementById("status").innerText = "Código lido!";
            tocarBeep();

            try {
              await html5QrCode.stop();
              await html5QrCode.clear();
            } catch (e) {
              console.log("Erro ao finalizar câmera:", e);
            }

            setTimeout(() => {
              voltarParaApp(decodedText);
            }, 250);
          },
          function(errorMessage) {
            // Ignora erros contínuos de leitura
          }
        );
      } catch (err) {
        document.getElementById("status").innerText = "Erro ao acessar a câmera";
        console.log("Erro ao iniciar leitor:", err);
      }
    }

    window.addEventListener("load", iniciarLeitor);
  </script>
</body>
</html>
