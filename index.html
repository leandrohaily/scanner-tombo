<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Invent JUS</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    html, body {
      margin: 0 !important;
      padding: 0 !important;
      width: 100% !important;
      height: 100% !important;
      min-height: 100dvh !important;
      font-family: Arial, sans-serif;
      color: #fff;
      background: #030d20 !important;
      overflow: hidden !important;
      -webkit-text-size-adjust: 100%;
    }

    body {
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }

    /* Container base configurado dinamicamente via JS caso o Safari tente espremer */
    .app {
      width: 100% !important;
      height: 100dvh !important;
      padding: max(20px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
      display: flex !important;
      flex-direction: column !important;
      justify-content: center !important;
      align-items: center !important;
      background: radial-gradient(circle at top, rgba(64, 110, 255, 0.20), transparent 34%),
                  linear-gradient(180deg, #030d20 0%, #071a3b 45%, #041127 100%) !important;
    }

    /* O Card agora usará largura máxima controlada e responsiva por JS no mobile */
    .card-container {
      width: 100% !important;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px rgba(255, 255, 255, 0.08) solid;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 32px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
    }

    .logo-wrap { display: flex; justify-content: center; align-items: center; margin-bottom: 16px; }
    .logo-wrap img { max-width: 220px; width: 100%; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.28)); }

    .title { text-align: center; font-size: 20px; font-weight: 700; margin-bottom: 6px; letter-spacing: 0.2px; }
    .subtitle { text-align: center; font-size: 13px; color: rgba(255,255,255,0.75); line-height: 1.45; margin-bottom: 24px; }

    .scanner-shell {
      position: relative;
      overflow: hidden;
      border-radius: 22px;
      background: #000;
      width: 100% !important;
      aspect-ratio: 4 / 3; 
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.08), 0 10px 25px rgba(0,0,0,0.3);
    }

    #reader {
      width: 100% !important;
      height: 100% !important;
      background: #000;
      border: none !important;
    }

    #reader video {
      width: 100% !important;
      height: 100% !important;
      object-fit: cover !important;
      border-radius: 22px;
    }

    #reader__scan_region svg { display: none !important; }

    .overlay { position: absolute; inset: 0; pointer-events: none; z-index: 20; }

    .scan-box {
      position: absolute; left: 50%; top: 50%;
      width: 82%; height: 140px; 
      transform: translate(-50%, -50%);
      border: none !important;
      box-shadow: none !important; 
    }

    .laser-line {
      position: absolute; left: 5%; right: 5%; height: 3px;
      background: #ff4747; box-shadow: 0 0 12px #ff4747;
      animation: laserMove 2.2s ease-in-out infinite;
      z-index: 22;
      opacity: 0; 
      transition: opacity 0.5s;
    }
    
    .laser-active { opacity: 1 !important; }

    @keyframes laserMove { 
      0%, 100% { top: 15%; } 
      50% { top: 85%; } 
    }

    .scan-hint {
      position: absolute;
      left: 50%;
      bottom: 16px;
      transform: translateX(-50%);
      width: 90%;
      text-align: center;
      font-size: 12px;
      color: rgba(255,255,255,0.75);
      text-shadow: 0 1px 3px rgba(0,0,0,0.6);
      z-index: 23;
      opacity: 0;
      transition: opacity 0.5s;
      white-space: nowrap;
    }

    .reading-status { 
      margin-top: 24px; 
      text-align: center; 
      font-size: 16px; 
      font-weight: 600; 
      color: rgba(255,255,255,0.85); 
    }

    .cancel-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      width: 100%;
      max-width: 220px;
      height: 48px;
      border-radius: 14px;
      border: none;
      background: linear-gradient(180deg, #d62828 0%, #b71c1c 100%);
      color: #fff;
      font-weight: 700;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
    }

    #successOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 168, 89, 0.96);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="app" id="appRoot">
    <div class="card-container" id="mainCard">
      <div class="logo-wrap">
        <img src="logo-inventjus.png" alt="Invent JUS">
      </div>

      <div class="title">Leitor de código de barras</div>
      <div class="subtitle">
        Centralize a etiqueta patrimonial dentro da área de leitura.
      </div>

      <div class="scanner-shell">
        <div id="reader"></div>

        <div class="overlay">
          <div class="scan-box">
            <div class="laser-line" id="laser"></div>
          </div>

          <div class="scan-hint" id="hint">
            Aproxime e mantenha o código alinhado na horizontal
          </div>
        </div>
      </div>

      <div class="reading-status" id="status-text">
        Iniciando...
      </div>

      <button class="cancel-btn" onclick="retornarAoApp('cancelado')">
        Cancelar
      </button>
    </div>
  </div>

  <div id="successOverlay">
    <div style="font-size:72px">✔</div>
    <div style="font-size:22px; font-weight:800">
      TOMBO LIDO
    </div>
  </div>

  <script>
    // SCRIPT DE RESET DE VIEWPORT CRUCIAL PARA O SAFARI DO IOS
    function aplicarFixViewportIOS() {
      // Verifica a largura real da janela física do aparelho
      const larguraFisica = window.innerWidth || document.documentElement.clientWidth;
      
      // Se for menor que 600px, o Safari aplicou zoom out indevido vindo do Flutter
      if (larguraFisica > 500 && /iPhone|iPad|iPod/i.test(navigator.userAgent)) {
        const root = document.getElementById('appRoot');
        const card = document.getElementById('mainCard');
        if (root && card) {
          // Força dinamicamente o container a quebrar o zoom herdado expandindo a área útil
          root.style.setProperty('width', '100vw', 'important');
          card.style.setProperty('width', '92%', 'important');
          card.style.setProperty('max-width', '440px', 'important');
        }
      }
    }

    const APP_URL = "https://inventario-patrimonial-orzkxr.flutterflow.app/listaBensInventariadosCopy";

    let html5QrCode = null;
    let isReturning = false;

    function playSyntheticBeep() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);

        gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
        gainNode.gain.linearRampToValueAtTime(0.5, audioCtx.currentTime + 0.01);
        gainNode.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);

        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.2);
      } catch (e) {}
    }

    async function retornarAoApp(codigo = null) {
      if (isReturning) return;
      isReturning = true;

      if (codigo && codigo !== 'cancelado') {
        document.getElementById("successOverlay").style.display = "flex";
        playSyntheticBeep();
        if (navigator.vibrate) {
          navigator.vibrate([100, 50, 100]);
        }
      }

      const url = new URL(APP_URL);

      if (codigo === 'cancelado') {
        url.searchParams.set("tombo", "cancelado");
      } else if (codigo) {
        url.searchParams.set("tombo", codigo.replace(/\D/g, ""));
      } else {
        url.searchParams.set("tombo", "");
      }

      url.searchParams.set("scanner_return", "1");
      url.searchParams.set("t", Date.now());

      if (html5QrCode) {
        try {
          await html5QrCode.stop();
        } catch(e) {}
      }

      setTimeout(() => {
        window.location.assign(url.toString());
      }, codigo && codigo !== 'cancelado' ? 400 : 0);
    }

    function iniciarScanner() {
      html5QrCode = new Html5Qrcode("reader");

      const config = {
        fps: 25,
        qrbox: { width: 300, height: 160 },
        aspectRatio: 1.333333
      };

      html5QrCode.start(
        { facingMode: "environment" },
        config,
        (text) => {
          retornarAoApp(text);
        }
      ).then(() => {
        document.getElementById('status-text').innerText = "Lendo...";
        document.getElementById('laser').classList.add('laser-active');
        document.getElementById('hint').classList.add('laser-active');
      }).catch(() => {
        document.getElementById('status-text').innerText = "Erro ao acessar câmera.";
      });
    }

    window.addEventListener("load", () => {
      aplicarFixViewportIOS();
      setTimeout(iniciarScanner, 200);
    });
    
    window.addEventListener("resize", aplicarFixViewportIOS);
  </script>

</body>
</html>
