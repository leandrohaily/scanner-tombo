<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Relatório</title>
</head>
<body>
<script>
  async function carregarRelatorio() {
    const params = new URLSearchParams(window.location.search);
    const url = params.get('url');

    if (!url) {
      document.body.innerHTML = 'URL do relatório não informada.';
      return;
    }

    const response = await fetch(url);
    const html = await response.text();

    document.open();
    document.write(html);
    document.close();
  }

  carregarRelatorio();
</script>
</body>
</html>
